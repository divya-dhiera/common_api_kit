name: common_api_kit
description: A Flutter API package powered by Dio for HTTP requests, authentication, connectivity checks, loading dialogs, and GetX integration.
version: 0.0.3
homepage: https://github.com/divya-dhiera/common_api_kit
repository: https://github.com/divya-dhiera/common_api_kit

environment:
  sdk: ^3.12.1
  flutter: ">=1.17.0"

dependencies:
  flutter:
    sdk: flutter
  dio: ^5.11.1
  connectivity_plus: ^7.3.2
  flutter_spinkit: ^5.2.2
  get: ^4.7.3
  get_storage: ^2.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true